[project]
name = "llvm-manager"
dynamic = ["version"]
description = "Build, install, discover, and switch between LLVM versions"
requires-python = ">=3.10"

[project.scripts]
llvm-manager = "llvm_mgr.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["llvm_mgr"]

[tool.setuptools.dynamic]
version = {attr = "llvm_mgr.__version__"}
